name: Build and Release Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt6 mysql-connector-python pywin32 wmi bcrypt pyinstaller

      - name: Build SwiftOptimizer
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SwiftOptimizer admin_dashboard.py

      - name: Build SwiftAgent
        run: |
          pyinstaller --noconfirm --onefile --name SwiftAgent agent/usb_agent.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup_usb_control.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/SwiftProsys_Swift_Optimizer_Setup.exe