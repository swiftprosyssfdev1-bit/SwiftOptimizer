name: Build and Release Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt6 mysql-connector-python pywin32 wmi bcrypt pyinstaller python-dotenv

      - name: Write .env and agent_config.txt from secrets
        shell: powershell
        run: |
          @"
          USB_DB_HOST=$env:USB_DB_HOST
          USB_DB_USER=$env:USB_DB_USER
          USB_DB_PASSWORD=$env:USB_DB_PASSWORD
          USB_DB_NAME=$env:USB_DB_NAME
          "@ | Set-Content -Path ".env" -Encoding utf8

          @"
          ; USB Control Agent — Configuration File (generated for CI build)
          [mysql]
          host     = $env:USB_DB_HOST
          user     = $env:USB_DB_USER
          password = $env:USB_DB_PASSWORD
          database = $env:USB_DB_NAME

          [agent]
          username =
          "@ | Set-Content -Path "agent\agent_config.txt" -Encoding utf8
        env:
          USB_DB_HOST: ${{ secrets.USB_DB_HOST }}
          USB_DB_USER: ${{ secrets.USB_DB_USER }}
          USB_DB_PASSWORD: ${{ secrets.USB_DB_PASSWORD }}
          USB_DB_NAME: ${{ secrets.USB_DB_NAME }}

      - name: Build SwiftOptimizer
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SwiftOptimizer --icon "assets\icon.ico" --version-file "version_info_optimizer.txt" --add-data "assets;assets" --add-data "core;core" --add-data ".env;." --hidden-import registry_utils --hidden-import db --hidden-import gui_utils --hidden-import styles --hidden-import dotenv main.py

      - name: Build SwiftAgent
        run: |
          pyinstaller --noconfirm --onefile --name SwiftAgent --icon "assets\icon.ico" --version-file "agent\version_info_agent.txt" --add-data "agent\agent_config.txt;." --hidden-import registry_utils --hidden-import db --hidden-import agent.agent_core --hidden-import win32serviceutil --hidden-import win32service --hidden-import win32event --hidden-import servicemanager --hidden-import winerror --hidden-import pythoncom --hidden-import pywintypes --hidden-import wmi --hidden-import win32com --hidden-import win32com.client --hidden-import win32api --hidden-import win32timezone --paths "." agent\swift_agent_service.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "setup_usb_control.iss"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/SwiftProsys_Swift_Optimizer_Setup.exe
